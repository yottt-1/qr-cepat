name: Windows checks and portable app
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore locked dependencies
        run: |
          dotnet restore Windows/QRCepat.Tests --locked-mode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore Windows/QRCepat.Windows --locked-mode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore Windows/QRCepat.VisualTests --locked-mode
      - name: Decode PNGs and validate renderer
        run: dotnet run --project Windows/QRCepat.Tests -c Release --no-restore
      - name: Publish portable Windows x64
        run: ./Windows/package.ps1
      - name: Test the packaged executable and capture UI
        run: |
          $results = Join-Path $PWD "dist/windows-qa"
          $process = Start-Process -FilePath "dist/windows-x64/QR Cepat.exe" -ArgumentList "--self-test", $results -PassThru
          if (-not $process.WaitForExit(120000)) {
            $process.Kill()
            throw "Windows UI test timed out"
          }
          if (Test-Path "$results/failure.txt") { Get-Content "$results/failure.txt" }
          if ($process.ExitCode -ne 0) { throw "Windows UI test exited $($process.ExitCode)" }
          if (-not (Test-Path "$results/results.txt")) { throw "UI test did not produce results" }
          Get-Content "$results/results.txt"
      - name: Decode the exported PNG and rendered UI screenshots
        run: dotnet run --project Windows/QRCepat.VisualTests -c Release --no-restore -- dist/windows-qa
      - name: Upload portable download
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: QR-Cepat-Windows-x64
          path: |
            dist/QR-Cepat-*-Windows-x64.zip
            dist/SHA256SUMS-Windows
          if-no-files-found: error
      - name: Upload Windows QA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Windows-QA
          path: dist/windows-qa/
          if-no-files-found: warn
