name: Bug report / Laporan masalah
description: Report a reproducible problem with safe sample data.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "Public report: no real credentials, private QR images, or personal data."
  - type: input
    id: environment
    attributes:
      label: Operating system, hardware, app version
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps and harmless sample input
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
